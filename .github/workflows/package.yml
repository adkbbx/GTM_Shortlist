name: Package
# Every push builds the PyPI package with the UI inside and runs it from a fresh install.
# A v* tag also publishes it to PyPI through trusted publishing (no stored token).
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python scripts/package_ui.py
      - run: pip install build
      - run: python -m build --outdir package-dist
      - run: python scripts/package_smoke.py package-dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: package-dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: package-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: package-dist/
